<!doctype html>
<!-- 링크 미리보기 이미지(og.png)의 원본. 헤드리스 Chrome으로 1200x630 캡처:
     chrome --headless=new --allow-file-access-from-files --window-size=1200,630 --screenshot=img/og.png img/og.html -->
<meta charset="utf-8">
<style>
@font-face { font-family: "NeoDGM Code"; src: url("../fonts/neodgm_code.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #e0e2e6; }
body { font-family: "NeoDGM Code", monospace; color: #161616; -webkit-font-smoothing: none; }
.paper {
  position: absolute; left: 240px; top: 56px; width: 720px; height: 640px; background: #fdfdfb; padding: 44px 48px 0;
  filter: drop-shadow(0 10px 28px rgba(90, 96, 108, .45));
  clip-path: polygon(0 10px, 1.667% 0, 3.333% 10px, 5% 0, 6.667% 10px, 8.333% 0, 10% 10px, 11.667% 0, 13.333% 10px, 15% 0, 16.667% 10px, 18.333% 0, 20% 10px, 21.667% 0, 23.333% 10px, 25% 0, 26.667% 10px, 28.333% 0, 30% 10px, 31.667% 0, 33.333% 10px, 35% 0, 36.667% 10px, 38.333% 0, 40% 10px, 41.667% 0, 43.333% 10px, 45% 0, 46.667% 10px, 48.333% 0, 50% 10px, 51.667% 0, 53.333% 10px, 55% 0, 56.667% 10px, 58.333% 0, 60% 10px, 61.667% 0, 63.333% 10px, 65% 0, 66.667% 10px, 68.333% 0, 70% 10px, 71.667% 0, 73.333% 10px, 75% 0, 76.667% 10px, 78.333% 0, 80% 10px, 81.667% 0, 83.333% 10px, 85% 0, 86.667% 10px, 88.333% 0, 90% 10px, 91.667% 0, 93.333% 10px, 95% 0, 96.667% 10px, 98.333% 0, 100% 10px, 100% 100%, 0 100%);
}
.wrap { position: absolute; inset: 0; }
.src { text-align: center; font-size: 32px; }
h1 { text-align: center; font-size: 64px; font-weight: normal; margin: 6px 0 14px; }
.rule { font-size: 32px; white-space: nowrap; overflow: hidden; }
.row { display: flex; justify-content: space-between; font-size: 32px; line-height: 44px; }
.band { background: #161616; color: #fdfdfb; font-size: 32px; padding: 2px 14px; margin: 16px 0 14px; }
.grid { display: grid; grid-template-rows: repeat(7, 9px); grid-auto-flow: column; grid-auto-columns: 9px; gap: 3px; justify-content: space-between; }
.grid i { display: block; }
.l1 { background: repeating-conic-gradient(#161616 0 25%, #fdfdfb 0 50%) 0 0 / 6px 6px; opacity: .45; }
.l2 { background: repeating-conic-gradient(#161616 0 25%, #fdfdfb 0 50%) 0 0 / 3px 3px; }
.l3 { background: repeating-conic-gradient(#161616 0 75%, #fdfdfb 0 100%) 0 0 / 3px 3px; }
.l4 { background: #161616; }
</style>
<div class="wrap"><div class="paper">
  <p class="src">VIBE-CHECK</p>
  <h1>YEAR IN REVIEW</h1>
  <p class="rule">------------------------------------------------</p>
  <div class="row"><b style="font-weight:normal;text-shadow:1px 0 #161616">Prompts sent</b><b style="font-weight:normal;text-shadow:1px 0 #161616">8,641</b></div>
  <div class="row"><span>Days used</span><span>241 days (76.3%)</span></div>
  <div class="row"><span>Longest streak</span><span>23 days</span></div>
  <div class="row"><span>Prompts with swearing</span><span>4.2%</span></div>
  <p class="band">ACTIVITY</p>
  <div class="grid" id="g"></div>
</div></div>
<script>
// 고정된 난수로 잔디밭 무늬를 만든다
let s = 20260101;
const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
const g = document.getElementById('g');
for (let i = 0; i < 52 * 7; i++) {
  const weekend = i % 7 >= 5, r = rnd();
  const lv = r < (weekend ? .5 : .16) ? 0 : 1 + Math.floor(rnd() * 4);
  const c = document.createElement('i');
  if (lv) c.className = 'l' + lv;
  g.append(c);
}
</script>
